name: Enterprise CI/CD Deployment

on:
  push:
    branches:
      - master
      - main
    paths:
      - '**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build & Push AI ---
      - name: Build and push AI image
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ettawa-ai:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      # --- Build & Push Backend ---
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ettawa-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # --- Build & Push Frontend ---
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ettawa-frontend:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://api.ettawa-sakra.momoi.my.id
            NEXT_PUBLIC_API_KEY=EttawaSecureKey2026!
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }} # or fallback to authkey
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Because Tailscale creates a secure tunnel, Appleboy uses the runner's networking 
          # which is now joined to the Tailnet.
          script: |
            echo "Connected to baremetal server via Tailscale!"
            
            # Navigate to the deployment path
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Tidak perlu menimpa .env karena sudah dibuat manual oleh user
            # echo "GHCR_REPO=${{ github.repository }}" > .env
            
            # Login to GHCR on the baremetal
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest zero-downtime images
            docker compose pull
            
            # Restart containers in detached mode without downtime
            docker compose up -d

            # Clean up old dangling images to save space
            docker image prune -a -f
